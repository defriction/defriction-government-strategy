name: actualizar-ranking

on:
  push:
    branches: [main]
    paths:
      - "docs/ranking-contribuciones.md"
      - ".github/scripts/generate-ranking.py"
      - ".github/workflows/ranking-contribuciones.yml"
  schedule:
    - cron: "0 6 * * 1"  # every Monday 6am UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}

      - name: Generate ranking
        run: python .github/scripts/generate-ranking.py
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "defriction-bot"
            git config user.email "bot@defriction.org"
            git add docs/ranking-contribuciones.md
            git commit -m "chore: auto-update contributor ranking"
            git push
          fi
